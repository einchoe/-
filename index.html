// 문장 렌더: key = orig(원문 강조) | s(유의어 치환) | a(반의어 치환) | blank
function hl(r,key){const t=r.t;let i=t.indexOf(r.m);if(i<0)i=t.toLowerCase().indexOf(r.m.toLowerCase());if(i<0)return esc(t);
 const orig=t.substr(i,r.m.length);let rep=key=='orig'?orig:key=='blank'?'_______':r[key];
 if(key!='orig'&&key!='blank'&&/[A-Z]/.test(r.m[0])&&i==0)rep=rep[0].toUpperCase()+rep.slice(1);
 const tg={orig:['<mark>','</mark>'],blank:['<b>','</b>']}[key]||['<u>','</u>'];
 return esc(t.slice(0,i))+tg[0]+esc(rep)+tg[1]+esc(t.slice(i+r.m.length))}
function home(){const t=S.items.length,m=S.items.filter(i=>i.lv>=4).length,n=pool().filter(i=>!i.seen).length;
const chs=[...new Set(S.items.map(i=>i.ch).filter(Boolean))];
app.innerHTML=`<div class="card"><h2>오늘의 훈련</h2><div class="row"><div class="lab">챕터(지문) 범위</div><select onchange="S.ch=this.value;save();go('home')"><option value="">전체</option>${chs.map(c=>`<option ${S.ch==c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
<div class="grid"><div class="stat"><b>${dueList().length}</b>오늘 복습</div><div class="stat"><b>${n}</b>새 단어</div><div class="stat"><b>${m}/${t}</b>장기기억(Lv4+)</div></div>
<p>권장 루틴: ① 학습 → ② 타이핑 회상 → ③ 단어 선택 → ④ 지문 문장 → ⑤ 시험(약점 위주)</p>
<button class="b" onclick="go('study')">📖 학습</button><button class="b" onclick="go('recall')">✍️ 회상</button><button class="b" onclick="go('sentence')">📄 지문 문장</button><button class="b g" onclick="go('exam')">📝 시험</button></div>
<div class="card"><b>복습 단계</b><p class="sm">Lv0 오늘 → Lv1 1일 → Lv2 3일 → Lv3 7일 → Lv4 14일 → Lv5 30일. 힌트 없이 10초 안에 맞히면 단계↑, 틀리면 오늘 재출제됩니다.</p></div>`}
let si=0,sl=[];
function study(){sl=pool().filter(i=>!i.seen);if(!sl.length)sl=sh(pool());sl=sl.slice(0,10);si=0;sCard()}
const chips=(a,c)=>a.length?a.map(x=>`<span class="chip ${c}">${esc(x)}</span>`).join(''):'<span class="sm">-</span>';
function sCard(){if(si>=sl.length){app.innerHTML=`<div class="card"><h2>학습 완료 🎉</h2><button class="b" onclick="go('recall')">✍️ 회상하기</button><button class="b g" onclick="go('sentence')">📄 지문 문장</button></div>`;return}
const i=sl[si];i.seen=1;save();
app.innerHTML=`<div class="bar"><i style="width:${si/sl.length*100}%"></i></div><div class="card"><span class="tag">${esc(i.pos)}</span><span class="tag">${esc(i.ch)}</span>
<div class="big">${esc(i.word)}</div><div class="q">${esc(i.meaning)}</div>
<div class="row"><div class="lab">유의어</div>${chips(i.syn,'syn')}</div><div class="row"><div class="lab">반의어</div>${chips(i.ant,'ant')}</div>
<div class="row"><div class="lab">지문 속 문장</div>${recs(i).map(r=>`<div class="sent">${hl(r,'orig')}</div>`).join('')||'<span class="sm">-</span>'}</div>
<button class="b g" onclick="si=Math.max(0,si-1);sCard()">◀</button><button class="b" onclick="si++;sCard()">다음 ▶</button></div>`}
// ---- 문제 생성
function dist(i,r,key,n=3){const bad=new Set([i.word.toLowerCase(),...i.syn.map(x=>x.toLowerCase())]);
 let c=S.items.filter(x=>!bad.has(x.word.toLowerCase())&&!x.syn.map(y=>y.toLowerCase()).includes((r[key]||'').toLowerCase())&&!i.ant.map(y=>y.toLowerCase()).includes(x.word.toLowerCase()));
 c=sh(c).sort((a,b)=>(b.pos==i.pos)-(a.pos==i.pos));return c.slice(0,n).map(x=>x.word)}
function mk(i,k){const R=recs(i);
 if(k=='m2e')return{i,et:k,p:`<div class="lab">한→영 인출</div><div class="q">“${esc(i.meaning)}”</div>영어 단어는?`,ans:[i.word],inp:1};
 if(k=='e2m')return{i,et:k,p:`<div class="lab">영→한</div><div class="big">${esc(i.word)}</div>뜻은? (핵심 단어만 써도 OK)`,ans:i.meaning.split(/[,;~()]/).map(s=>s.trim()).filter(x=>x.length>1),inp:1,part:1};
 if(k=='syn'&&i.syn.length)return{i,et:k,p:`<div class="lab">유의어 인출</div><div class="big">${esc(i.word)}</div>유의어를 1개 쓰세요.`,ans:i.syn,inp:1};
 if(k=='ant'&&i.ant.length)return{i,et:k,p:`<div class="lab">반의어 인출</div><div class="big">${esc(i.word)}</div>반의어를 1개 쓰세요.`,ans:i.ant,inp:1};
 if(k=='cloze'&&R.length){const r=sh(R)[0];return{i,et:k,p:`<div class="lab">지문 빈칸 (${esc(i.meaning)})</div><div class="q">${hl(r,'blank')}</div>`,ans:[r.m,i.word],inp:1,hint:i.word,after:`<div class="sent">${hl(r,'orig')}</div>`}}
 if(k=='synC'||k=='antC'){const key=k=='synC'?'syn':'ant',oth=k=='synC'?'ant':'syn';if(!i[key].length)return null;
  const right=sh(i[key])[0],bad=new Set([...i[key],i.word].map(x=>x.toLowerCase()));
  let w=[...i[oth],...S.items.flatMap(x=>x[key].concat(x[oth]))].filter(x=>!bad.has(x.toLowerCase()));w=[...new Set(sh(w))];
  w=[...sh(i[oth]),...w.filter(x=>!i[oth].includes(x))].slice(0,3);if(w.length<3)return null;
  return{i,et:k,p:`<div class="lab">${key=='syn'?'유의어':'반의어'} 고르기</div><div class="big">${esc(i.word)}</div>의 ${key=='syn'?'유의어':'반의어'}는?`,ch:sh([right,...w]),ans:[right]}}
 if(k=='sSyn'){const r=sh(R.filter(x=>x.s&&x.s!=x.m))[0];if(!r)return null;const d=dist(i,r,'s');if(d.length<3)return null;
  return{i,et:k,p:`<div class="lab">유의어 치환</div><div class="q">${hl(r,'s')}</div><div class="sm">문장을 해석해 보고, 밑줄 친 표현과 바꿔 쓸 수 있는 단어는?</div>`,ch:sh([i.word,...d]),ans:[i.word],after:`<div class="sent">${hl(r,'orig')}</div>`}}
 if(k=='sAnt'){const r=sh(R.filter(x=>x.a))[0];if(!r)return null;const d=dist(i,r,'a');if(d.length<3)return null;
  return{i,et:k,p:`<div class="lab">반의어 교정</div><div class="q">${hl(r,'a')}</div><div class="sm">문맥상 틀린 문장입니다. 밑줄 친 표현 대신 넣어 옳게 고칠 수 있는 단어는?</div>`,ch:sh([i.word,...d]),ans:[i.word],after:`<div class="sent">${hl(r,'orig')}</div>`}}
 return null}
function startQ(mode){const kinds={recall:['m2e','e2m','syn','ant','cloze'],choice:['synC','antC'],sentence:['sSyn','sAnt'],exam:['m2e','syn','ant','cloze','synC','antC','sSyn','sAnt']}[mode];
 let l=dueList();if(mode=='exam')l=[...new Set([...l,...pool().filter(i=>Object.keys(i.err).length||i.lv<3)])];if(l.length<5)l=pool();
 const n=mode=='exam'?15:10,qs=[];for(const i of sh(l)){if(qs.length>=n)break;for(const k of sh(kinds)){const q=mk(i,k);if(q){qs.push(q);break}}}
 if(!qs.length){app.innerHTML='<div class="card">출제 가능한 문제가 없습니다. (데이터/문장 확인)</div>';return}
 Q={qs,n:0,ok:0,mode,log:[]};showQ()}
function showQ(){if(Q.n>=Q.qs.length){const r=Q;app.innerHTML=`<div class="card"><h2>결과 ${r.ok}/${r.qs.length}</h2><table>${r.log.map(l=>`<tr><td>${l.ok?'✅':'❌'}</td><td>${esc(l.w)}</td><td>${ET[l.et]}</td><td>${esc(l.a)}</td></tr>`).join('')}</table><button class="b" onclick="go('${r.mode}')">다시</button><button class="b g" onclick="go('weak')">약점 보기</button></div>`;nav();return}
 const q=Q.qs[Q.n];q.t0=Date.now();Q.hinted=0;
 app.innerHTML=`<div class="bar"><i style="width:${Q.n/Q.qs.length*100}%"></i></div><div class="card">${q.p}<div style="margin-top:14px">${q.inp?`<input type="text" id="in" autocomplete="off" onkeydown="if(event.key=='Enter')ans()"><button class="b" onclick="ans()">확인</button><button class="b g" onclick="ans(1)">모르겠음</button>${q.hint?`<button class="b g" onclick="Q.hinted=1;this.outerHTML='<span class=sm>첫 글자: ${esc(q.hint[0])}</span>'">힌트</button>`:''}`:q.ch.map((c,k)=>`<button class="ch" onclick="ansC(${k})">${esc(c)}</button>`).join('')}</div><div id="fb"></div></div>`;
 const e=$('#in');if(e)e.focus()}
function ansC(k){const q=Q.qs[Q.n];fin(q.ch[k]==q.ans[0],q.ch[k]);document.querySelectorAll('.ch').forEach((b,j)=>{b.disabled=1;if(q.ch[j]==q.ans[0])b.classList.add('ok');else if(j==k)b.classList.add('no')})}
function ans(skip){const q=Q.qs[Q.n],v=norm($('#in').value);let ok=false;
 if(!skip&&v)ok=q.ans.some(a=>{a=norm(a);return v==a||(q.part&&v.length>=2&&(a.includes(v)||v.includes(a)))});
 $('#in').disabled=1;fin(ok,v||'(모름)')}
function fin(ok,given){const q=Q.qs[Q.n],i=q.i,slow=Date.now()-q.t0>10000||Q.hinted;i.seen=1;let tag;
 if(ok){Q.ok++;if(slow){tag='고민 후 정답(불안정)';i.due=Date.now()+INT[i.lv]*DAY}else{tag='즉시 정답';i.lv=Math.min(5,i.lv+1);i.due=Date.now()+INT[i.lv]*DAY}}
 else{i.lv=i.lv>=3?1:0;i.due=Date.now();i.err[q.et]=(i.err[q.et]||0)+1;tag='오답 → 오늘 재출제'}
 Q.log.push({ok,w:i.word,et:q.et,a:given});save();
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'정답!':'오답'}</b> (${tag}) · 정답: <b>${esc(q.ans.slice(0,3).join(' / '))}</b>
 <div class="sm" style="margin-top:6px">${esc(i.word)} = ${esc(i.meaning)}<br>유의어: ${esc(i.syn.join(', ')||'-')} · 반의어: ${esc(i.ant.join(', ')||'-')}</div>${q.after?'<div class="lab" style="margin-top:8px">원문</div>'+q.after:''}</div><button class="b" onclick="Q.n++;showQ()" id="nx">다음 ▶</button>`;$('#nx').focus()}
function weak(){const w=S.items.filter(i=>Object.keys(i.err).length).sort((a,b)=>Object.values(b.err).reduce((x,y)=>x+y,0)-Object.values(a.err).reduce((x,y)=>x+y,0));
 const tot={};w.forEach(i=>Object.entries(i.err).forEach(([k,v])=>tot[k]=(tot[k]||0)+v));
 app.innerHTML=`<div class="card"><h2>약점 분석</h2><div class="grid">${Object.entries(tot).map(([k,v])=>`<div class="stat"><b>${v}</b>${ET[k]} 오답</div>`).join('')||'<p>아직 오답 기록이 없습니다.</p>'}</div></div>
 <div class="card"><b>자주 틀리는 단어</b><table><tr><th>단어</th><th>오답 유형</th><th>Lv</th></tr>${w.map(i=>`<tr><td>${esc(i.word)}</td><td>${Object.entries(i.err).map(([k,v])=>ET[k]+' '+v).join(', ')}</td><td>${i.lv}</td></tr>`).join('')}</table></div>`}
function data(){app.innerHTML=`<div class="card"><h2>📂 엑셀 불러오기</h2><p class="sm">열 이름: <b>단어, 품사, 뜻, 유의어, 반의어, 챕터</b> (여러 값은 쉼표로 구분)<br>※ 지문 문장은 별도로 연결됩니다(현재 내장된 지문 문장은 같은 단어에 자동 매칭).</p>
<input type="file" id="f" accept=".xlsx,.xls,.csv"><div class="row"><label><input type="checkbox" id="rep"> 기존 데이터를 모두 교체(학습 기록 초기화)</label></div>
<button class="b" onclick="imp()">불러오기</button><button class="b g" onclick="tpl()">현재 단어장 엑셀로 내려받기</button></div>
<div class="card"><b>백업 / 초기화</b><br><button class="b g" onclick="bk()">진행상황 내보내기(JSON)</button><button class="b g" onclick="if(confirm('모든 기록을 삭제하고 처음 상태로 돌릴까요?')){localStorage.removeItem(KEY);location.reload()}">전체 초기화</button></div>
<div class="card"><b>현재 데이터 (${S.items.length})</b><table>${S.items.map(i=>`<tr><td>${esc(i.word)}</td><td>${esc(i.meaning)}</td><td>${recs(i).length?'📄':''}</td><td>Lv${i.lv}</td></tr>`).join('')}</table></div>`}
function imp(){const f=$('#f').files[0];if(!f)return alert('파일을 선택하세요');const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
 const g=(r,...k)=>{for(const x of k)for(const y in r)if(y.trim().toLowerCase()==x)return r[y];return''};
 let id=Math.max(0,...S.items.map(i=>i.id))+1;
 const add=rows.filter(r=>g(r,'단어','word')).map(r=>mkItem({word:String(g(r,'단어','word')).trim(),pos:g(r,'품사','pos'),meaning:String(g(r,'뜻','meaning')),syn:g(r,'유의어','synonyms'),ant:g(r,'반의어','antonyms'),ch:String(g(r,'챕터','chapter'))},id++));
 if($('#rep').checked)S.items=add;else{const ex=new Set(S.items.map(i=>i.word.toLowerCase()));S.items.push(...add.filter(a=>!ex.has(a.word.toLowerCase())))}
 save();alert(add.length+'개 처리 완료');go('data')}catch(x){alert('읽기 실패: '+x.message)}};r.readAsArrayBuffer(f)}
function tpl(){const ws=XLSX.utils.json_to_sheet(S.items.map(i=>({단어:i.word,품사:i.pos,뜻:i.meaning,유의어:i.syn.join(', '),반의어:i.ant.join(', '),챕터:i.ch})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'vocab');XLSX.writeFile(wb,'vocab.xlsx')}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='vocalab-backup.json';a.click()}
nav();home();
</script></body></html>
